name: CI

# Checks every pull request on Linux: the runner's case-sensitive filesystem
# catches import casing mistakes that macOS and Windows hide.
# Deploy reuses this workflow (workflow_call) so the checks before a release
# are always the same as the checks on pull requests.
on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload dist/ as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; the comment shows the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
